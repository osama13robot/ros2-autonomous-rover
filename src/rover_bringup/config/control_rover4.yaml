# Parameters for the rover_control nodes: ROVER4 (4WD Ackermann)
# Same as control.yaml, with the explorer tuned for a larger car-like robot:
# goals further from walls and from the robot (it cannot turn in place).
mode_manager:
  ros__parameters:
    initial_mode: manual          # manual | auto
    teleop_timeout: 0.5           # s without keyboard commands -> stop
    nav_timeout: 0.5              # s without Nav2 commands -> stop
    max_linear: 0.5               # m/s  hard safety clamp for both modes
    max_angular: 1.2              # rad/s (yaw rate; steering limits the real value)
    cancel_nav_on_manual: true

frontier_explorer:
  ros__parameters:
    enabled_on_start: true        # explore as soon as the robot is in AUTO mode
    planner_period: 1.5
    min_frontier_size: 0.40
    clearance: 0.40
    min_goal_distance: 0.8
    distance_weight: 1.0
    size_weight: 0.6
    blacklist_radius: 0.6
    goal_timeout: 120.0
    stuck_timeout: 30.0
    reached_radius: 0.60
    return_home: true
    done_confirmations: 5

sim_sensor_adapter:
  ros__parameters:
    cloud_frame: camera_link
    cloud_stride: 2
